name: scout-packs
description: "B2B lead enrichment for AI agents: verified business emails at $0.01/lookup, lead packs at $0.01/pack. Machine-readable JSON, paid in USDC on Base over x402."
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      baseUrl:
        type: string
        description: "Scout Packs endpoint base URL"
        default: "http://localhost:8000"
    required: []
  commandFunction: |
    (config) => ({
      command: "uvx",
      args: ["scout-packs-mcp"],
      env: { BASE_URL: config.baseUrl || "http://localhost:8000" }
    })
